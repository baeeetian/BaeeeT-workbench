<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#242424" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="兔几工作台" />
  <title>兔几工作台</title>
  <link rel="apple-touch-icon" sizes="180x180" href="assets/tuji-rabbit-icon.png" />
  <link rel="icon" type="image/png" sizes="180x180" href="assets/tuji-rabbit-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23242424'/%3E%3Cpath d='M20 43c-4-8 1-16 8-16 3-7 14-6 16 2 6 0 8 8 4 13-4 5-22 7-28 1Zm8-16-3-12c0-3 5-3 6 0l1 10m3 1 2-12c1-3 6-2 5 1l-1 13' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap');
    :root { --paper:#f5f0e7; --paper-2:#fbf8f2; --ink:#4b3027; --muted:#89756b; --mist:#cbd8da; --mist-deep:#829da3; --gold:#bd9b67; --line:rgba(75,48,39,.14); --success:#58735e; --danger:#a44f47; --shadow:0 18px 50px rgba(75,48,39,.09); --radius:22px; --ease:cubic-bezier(.22,.8,.24,1); --nav-h:78px; --font-ming:"Songti SC","STSong","SimSun",serif; --font-title:"ZCOOL XiaoWei","STKaiti","KaiTi",serif; }
    * { box-sizing:border-box; }
    html { background:var(--paper); color:var(--ink); scroll-behavior:smooth; }
    body { margin:0; min-width:320px; font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; font-size:16px; line-height:1.55; background:radial-gradient(circle at 85% 6%,rgba(203,216,218,.38),transparent 28rem), var(--paper); }
    button,input,select,textarea { font:inherit; }
    button { cursor:pointer; }
    a { color:inherit; }
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:3px solid var(--gold); outline-offset:3px; }
    .skip-link { position:fixed; top:-100px; left:16px; z-index:1000; padding:10px 14px; border-radius:10px; background:var(--ink); color:white; }
    .skip-link:focus { top:16px; }
    .app-shell { min-height:100dvh; }
    .sidebar { display:none; }
    .main { min-width:0; padding:24px 18px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px); }
    .content { width:min(100%,1180px); margin:0 auto; }
    .brand { display:flex; align-items:center; gap:10px; color:var(--ink); text-decoration:none; }
    .brand-mark { width:42px; height:42px; display:grid; place-items:center; border-radius:13px; background:var(--ink); color:#fff; flex:none; }
    .brand-mark svg { width:27px; height:27px; }
    .brand-name { font-family:Georgia,"Times New Roman",serif; font-size:21px; letter-spacing:.04em; }
    .eyebrow { margin:0 0 8px; color:var(--muted); font-size:12px; letter-spacing:.14em; text-transform:uppercase; }
    h1,h2,h3,p { margin-top:0; }
    h1,h2,h3,.home-intro .hello,.home-intro .date { font-family:var(--font-title); font-weight:500; letter-spacing:-.02em; }
    h1 { font-size:clamp(31px,5vw,58px); line-height:1.08; margin-bottom:12px; }
    h2 { font-size:clamp(24px,3vw,34px); margin-bottom:8px; }
    h3 { font-size:20px; margin-bottom:6px; }
    .page-head { display:block; margin:4px 0 24px; padding-top:30px; }
    .page-head .title-line { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .page-head .title-line h1 { min-width:0; margin:0; }
    .page-head .title-line .head-actions { flex:none; }
    .page-head p { color:var(--muted); margin-bottom:0; }
    .page-head > div > p:last-child { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
    .head-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .btn { border:1px solid var(--line); border-radius:999px; min-height:44px; padding:9px 16px; display:inline-flex; align-items:center; justify-content:center; gap:8px; color:var(--ink); background:rgba(251,248,242,.74); white-space:nowrap; transition:transform 180ms var(--ease),background 180ms var(--ease),border-color 180ms var(--ease); touch-action:manipulation; }
    .btn[data-action="new-collect"] .icon { width:14px; height:14px; }
    .btn:hover { background:var(--paper-2); border-color:rgba(36,36,36,.28); }
    .btn:active { transform:scale(.97); }
    .btn.primary { color:#fff; border-color:var(--ink); background:var(--ink); }
    .btn.ghost { background:transparent; }
    .btn.danger { color:var(--danger); }
    .btn.small { min-height:38px; padding:7px 12px; font-size:14px; }
    .icon { width:18px; height:18px; display:block; flex:none; }
    .card { background:rgba(251,248,242,.76); border:1px solid rgba(36,36,36,.09); border-radius:var(--radius); box-shadow:0 10px 35px rgba(36,36,36,.04); }
    .card-pad { padding:20px; }
    .hero { position:relative; overflow:hidden; min-height:245px; padding:clamp(24px,5vw,54px); display:flex; align-items:flex-end; background:linear-gradient(135deg,#f9f5ec 0%,#e8eff0 100%); }
    .hero:after { content:""; position:absolute; width:260px; height:260px; right:3%; top:-24%; border-radius:50%; background:rgba(255,255,255,.35); box-shadow:inset 0 0 0 1px rgba(255,255,255,.35); }
    .hero-copy { position:relative; z-index:1; max-width:590px; }
    .hero-art { position:absolute; right:8%; bottom:16px; width:170px; height:160px; opacity:.58; color:var(--mist-deep); }
    .hero-art svg { width:100%; height:100%; }
    .home-intro { padding:42px 6px 28px; text-align:center; }
    .home-intro .hello { margin:0; color:#302d2a; font-size:clamp(40px,10vw,72px); font-style:italic; font-weight:400; letter-spacing:-.055em; line-height:1.06; }
    .home-intro .date { margin:12px 0 0; color:#8d8880; font-size:16px; letter-spacing:.08em; }
    .home-intro .rule { width:48px; height:2px; margin:18px auto 0; border-radius:99px; background:#c9b7a6; }
    .home-module { min-height:240px; }
    .home-module .section-head h2 { font-size:25px; }
    .home-module .module-icon { display:none; }
    .inspiration-module { position:relative; overflow:hidden; }
    .inspiration-module::after { content:""; position:absolute; z-index:0; right:10px; bottom:8px; width:230px; height:230px; background:url("assets/tuji-rabbit-icon.png") center/contain no-repeat; opacity:.2; mix-blend-mode:screen; pointer-events:none; }
    .inspiration-module > * { position:relative; z-index:1; }
    .daily-image { margin:0 0 18px; padding:0; }
    .daily-image img { display:block; width:100%; max-height:340px; object-fit:contain; border-radius:0; }
    .home-quote { color:rgba(75,48,39,.58) !important; font-family:var(--font-ming); font-size:15px; font-style:italic; line-height:1.8; max-width:34em; }
    .dashboard-grid { display:grid; gap:14px; margin-top:14px; }
    .grid-two { display:grid; gap:14px; }
    .section-head { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:14px; }
    .section-head h2,.section-head h3 { margin:0; }
    .muted { color:var(--muted); }
    .stat-row { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
    .stat { min-height:100px; padding:16px; border-radius:16px; background:rgba(203,216,218,.25); }
    .stat strong { display:block; font-family:Georgia,serif; font-size:32px; font-weight:500; }
    .stat span { color:var(--muted); font-size:13px; }
    .list { display:grid; gap:10px; }
    .list-item { display:flex; align-items:flex-start; gap:12px; padding:12px 0; border-top:1px solid var(--line); }
    .list-item:first-child { border-top:0; padding-top:0; }
    .list-item:last-child { padding-bottom:0; }
    .list-main { flex:1; min-width:0; }
    .list-main strong { display:block; font-weight:600; overflow-wrap:anywhere; }
    .list-main small { color:var(--muted); }
    .check { width:22px; height:22px; margin-top:2px; border:1.5px solid var(--mist-deep); border-radius:50%; background:transparent; flex:none; display:grid; place-items:center; }
    .check.done { border-color:var(--success); background:var(--success); color:#fff; }
    .check.done:after { content:"✓"; font-size:14px; }
    .priority { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:999px; font-size:12px; background:rgba(189,155,103,.14); color:#735d35; }
    .priority.high { background:rgba(164,79,71,.13); color:var(--danger); }
    .priority.low { background:rgba(79,118,95,.13); color:var(--success); }
    .pill { display:inline-flex; padding:4px 9px; border-radius:999px; font-size:12px; background:rgba(203,216,218,.46); color:#536b70; }
    .news-card { display:grid; gap:12px; }
    .news-item { display:grid; gap:3px; padding:12px 0; border-top:1px solid var(--line); }
    .news-item:first-child { border-top:0; padding-top:0; }
    .news-item a { text-decoration:none; font-weight:650; line-height:1.4; }
    .news-item a:hover { text-decoration:underline; text-decoration-color:var(--gold); text-underline-offset:4px; }
    .news-meta { color:var(--muted); font-size:12px; }
    .insight { position:relative; min-height:185px; padding:30px 20px 24px; background:transparent; color:var(--ink); overflow:hidden; }
    .insight:before { content:""; position:absolute; z-index:0; right:-34px; bottom:-6px; width:190px; height:190px; background:url("assets/tuji-rabbit-watermark.png") center/contain no-repeat; opacity:.34; pointer-events:none; }
    .insight .muted { color:var(--muted); }
    .insight .home-quote { display:inline; margin:0; }
    .insight .home-quote + .muted { display:inline; margin:0 0 0 6px; white-space:nowrap; font-size:12px; }
    .insight > * { position:relative; z-index:1; }
    .form-card { margin-bottom:16px; }
    .form-grid { display:grid; gap:12px; }
    label { display:grid; gap:6px; color:var(--muted); font-size:13px; }
    input,select,textarea { width:100%; min-height:44px; border:1px solid rgba(36,36,36,.16); border-radius:12px; padding:10px 12px; color:var(--ink); background:rgba(255,255,255,.56); }
    textarea { min-height:100px; resize:vertical; }
    .form-actions { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; margin-top:12px; }
    .board { display:grid; gap:14px; }
    .board-col { min-width:0; padding:16px; background:rgba(203,216,218,.19); border-radius:18px; }
    .board-col h3 { display:flex; justify-content:space-between; font-size:17px; }
    .count { font-family:ui-sans-serif,sans-serif; color:var(--muted); font-size:13px; }
    .project-card { position:relative; padding:14px; margin-top:10px; border:1px solid var(--line); border-radius:15px; background:rgba(251,248,242,.75); }
    .project-card button.edit { position:absolute; right:7px; top:7px; border:0; background:transparent; min-width:38px; min-height:38px; color:var(--muted); }
    .project-title-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding-right:34px; }
    .project-title-row h3 { margin:0; }
    .project-title-row .pill { flex:none; }
    .project-card p { color:var(--muted); font-size:14px; margin:8px 0; }
    .project-foot { display:flex; justify-content:space-between; gap:8px; color:var(--muted); font-size:12px; }
    .tabs { display:flex; gap:7px; padding:4px; width:max-content; max-width:100%; overflow:auto; border-radius:999px; background:rgba(203,216,218,.29); }
    .tab { min-height:40px; padding:7px 14px; border:0; border-radius:999px; background:transparent; color:var(--muted); }
    .tab.active { background:var(--paper-2); color:var(--ink); box-shadow:0 4px 12px rgba(36,36,36,.07); }
    .pomodoro { width:min(100%,560px); margin:0 auto; text-align:center; padding:42px 24px 46px; }
    .timer { min-height:176px; display:flex; align-items:center; justify-content:center; font-family:Georgia,serif; font-size:clamp(56px,16vw,100px); letter-spacing:.04em; line-height:1; margin:0 0 24px; font-variant-numeric:tabular-nums; }
    .timer-actions { width:min(100%,220px); margin:0 auto; display:flex; flex-direction:column; justify-content:center; gap:10px; }
    .pomodoro .timer-actions .btn { min-width:124px; min-height:52px; padding:11px 22px; font-size:16px; }
    .account-secret { font-family:ui-monospace,SFMono-Regular,monospace; letter-spacing:.12em; }
    .empty { padding:28px 12px; color:var(--muted); text-align:center; border:1px dashed rgba(36,36,36,.18); border-radius:14px; }
    .empty p { margin-bottom:12px; }
    .mobile-nav { position:fixed; z-index:30; left:12px; right:12px; bottom:calc(14px + env(safe-area-inset-bottom)); min-height:var(--nav-h); display:grid; grid-template-columns:repeat(5,1fr); gap:2px; padding:8px; border:1px solid rgba(255,255,255,.7); border-radius:24px; background:rgba(251,248,242,.92); box-shadow:var(--shadow); backdrop-filter:blur(18px); }
    .nav-item { min-width:44px; min-height:50px; display:grid; place-items:center; gap:2px; border:0; border-radius:16px; background:transparent; color:var(--muted); font-size:11px; }
    .nav-item .icon { width:19px; height:19px; }
    .nav-item.active { background:var(--ink); color:#fff; }
    .sheet::backdrop { background:rgba(36,36,36,.42); }
    .sheet { width:min(100% - 28px,520px); margin:auto; border:0; border-radius:24px; padding:0; background:var(--paper-2); color:var(--ink); box-shadow:0 24px 70px rgba(0,0,0,.2); }
    .sheet-inner { padding:20px; }
    .sheet-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .sheet-head h2 { margin:0; font-size:24px; }
    .icon-btn { min-width:44px; min-height:44px; border:0; border-radius:12px; display:grid; place-items:center; background:transparent; color:var(--muted); }
    .icon-btn:hover { background:rgba(203,216,218,.3); }
    .toast { position:fixed; z-index:100; right:18px; bottom:calc(100px + env(safe-area-inset-bottom)); max-width:min(360px,calc(100% - 36px)); padding:12px 15px; border-radius:14px; background:var(--ink); color:#fff; box-shadow:var(--shadow); transform:translateY(12px); opacity:0; pointer-events:none; transition:opacity 180ms var(--ease),transform 180ms var(--ease); }
    .toast.show { opacity:1; transform:translateY(0); }
    .subtle-line { height:1px; margin:20px 0; background:var(--line); }
    .security-note { padding:12px; border-radius:13px; color:#6f5c36; background:rgba(189,155,103,.12); font-size:13px; }
    .sync-status { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; }
    .sync-dot { width:8px; height:8px; flex:none; border-radius:50%; background:#879a8b; }
    .sync-status.offline .sync-dot { background:#b9b1a8; }
    .sync-status-mobile { justify-content:flex-end; margin:0 2px 8px; font-size:11px; }
    @media (min-width:1024px) { .sync-status-mobile { display:none; } }
    @media (max-width:679px) { .main { padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 150px); } .page-head .head-actions { flex:none; } .page-head .head-actions .btn { min-width:0; } }
    @media (min-width:680px) { .main { padding:36px 32px 60px; } .dashboard-grid { grid-template-columns:1fr 1fr; } .hero { grid-column:1/-1; } .grid-two { grid-template-columns:1fr 1fr; } .form-grid.two { grid-template-columns:1fr 1fr; } .board { grid-template-columns:repeat(3,1fr); } .home-intro { padding:28px 6px 38px; } }
    @media (min-width:1024px) { .app-shell { display:grid; grid-template-columns:236px 1fr; } .sidebar { display:flex; position:sticky; top:0; height:100dvh; flex-direction:column; padding:26px 16px; border-right:1px solid var(--line); background:rgba(245,240,231,.74); } .desktop-nav { display:grid; gap:6px; margin-top:44px; } .desktop-nav .nav-item { display:flex; justify-content:flex-start; gap:11px; padding:0 14px; color:var(--muted); font-size:14px; } .desktop-nav .nav-item.active { color:#fff; } .sidebar-bottom { margin-top:auto; display:grid; gap:5px; } .mobile-nav { display:none; } .main { padding:54px 50px 70px; } .page-head { padding-top:0; } .content { max-width:1190px; } .hero-art { width:210px; height:196px; right:10%; } .toast { bottom:25px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="桌面导航">
      <a class="brand" href="#home" data-route="home" aria-label="回到兔几工作台首页"><span class="brand-mark" data-icon="rabbit"></span><span class="brand-name">兔几工作台</span></a>
      <nav id="desktop-nav" class="desktop-nav" aria-label="主要导航"></nav>
      <div class="sidebar-bottom"><button class="nav-item" data-route="settings" type="button"><span data-icon="settings"></span><span>设置与迁移</span></button><small class="muted">把日子收好一点。</small></div>
    </aside>
    <main id="main-content" class="main" tabindex="-1"><div id="content" class="content"></div></main>
    <nav id="mobile-nav" class="mobile-nav" aria-label="移动端主要导航"></nav>
  </div>
  <dialog id="sheet" class="sheet"><div class="sheet-inner" id="sheet-inner"></div></dialog>
  <div id="toast-region" class="toast" role="status" aria-live="polite"></div>

  <script>

    function loadState(){ try { const raw=localStorage.getItem(KEY); return raw?{...initialState(),...JSON.parse(raw)}:initialState(); } catch { return initialState(); } }
    function openStateDb(){ return new Promise((resolve,reject)=>{ if(!('indexedDB' in window))return reject(new Error('IndexedDB unavailable')); const req=indexedDB.open('tuji-workbench',1); req.onupgradeneeded=()=>req.result.createObjectStore('state',{keyPath:'id'}); req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error); }); }
    function persistIndexedState(next){ idbWriteQueue=idbWriteQueue.then(async()=>{ const db=await openStateDb(); await new Promise((resolve,reject)=>{ const tx=db.transaction('state','readwrite'); tx.objectStore('state').put({id:'current',state:next}); tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error); }); db.close(); }).catch(()=>{}); }
    async function hydrateFromIndexedDb(){ try { const db=await openStateDb(); const record=await new Promise((resolve,reject)=>{ const req=db.transaction('state','readonly').objectStore('state').get('current'); req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error); }); db.close(); const localRaw=localStorage.getItem(KEY); if(record?.state&&(!localRaw||record.state.updatedAt>state.updatedAt)){ state={...initialState(),...record.state}; try{localStorage.setItem(KEY,JSON.stringify(state));}catch{} renderApp(); } else if(state)persistIndexedState(state); } catch {} }
    function saveState(next){ state={...next,updatedAt:Date.now()}; try { localStorage.setItem(KEY,JSON.stringify(state)); } catch {} persistIndexedState(state); }
    function update(mutator){ const draft=typeof structuredClone==='function'?structuredClone(state):JSON.parse(JSON.stringify(state)); saveState(mutator(draft)); renderApp(); }

    function fmtClock(s){ const m=Math.floor(Math.max(0,s)/60).toString().padStart(2,'0'); const sec=Math.max(0,s)%60; return m+':'+sec.toString().padStart(2,'0'); }

    function header(title,desc,action=''){ const labels={'待办事项':'TODO LIST','项目中心':'PROJECT CENTER','收集':'COLLECTION','番茄钟':'POMODORO TIMER','账号':'ACCOUNTS','科技动态':'TECH NEWS','设置与迁移':'SETTINGS & MIGRATION'}; return `<div class="page-head"><div><p class="eyebrow">${labels[title]||'TUJI WORKBENCH'}</p><div class="title-line"><h1>${title}</h1>${action?`<div class="head-actions">${action}</div>`:''}</div><p>${desc}</p></div></div>`; }

    function renderHome(){ const active=state.todos.filter(x=>!x.done&&!x.archived); const projects=state.projects.filter(x=>x.status==='进行中'); const top=active.slice().sort((a,b)=>({high:0,medium:1,low:2}[a.priority]-({high:0,medium:1,low:2}[b.priority])))[0]; const items=(state.newsCache?.items||sampleNews).slice(0,5); const inspiration=state.inspirations.find(x=>x.pinned)||state.inspirations[0]; const date=new Date().toLocaleDateString('zh-CN',{weekday:'long',month:'long',day:'numeric'}); return `${header(date,'今天也给重要的事留一点位置。',actionBtn('开始专注','pomodoro','primary','clock'))}<section class="card hero" aria-label="兔几欢迎区"><div class="hero-copy"><p class="eyebrow">A SOFT PLACE TO BEGIN</p><h1>你好，兔几。</h1><p class="muted">把散落的念头、正在发生的事情，还有今天想完成的一小步，放在这里。</p><div class="head-actions">${actionBtn('写下一点灵感','collect','ghost','spark')} ${actionBtn('添加待办','todos','ghost','plus')}</div></div><div class="hero-art" aria-hidden="true">${icon('rabbit')}</div></section><div class="dashboard-grid"><section class="card card-pad"><div class="section-head"><h2>今天要做</h2><span class="pill">${active.length} 件未完成</span></div><div class="stat-row"><div class="stat"><strong>${active.length}</strong><span>还在手里的事</span></div><div class="stat"><strong>${projects.length}</strong><span>进行中的项目</span></div></div><div class="subtle-line"></div>${top?`<div class="list-item"><button class="check" data-todo-toggle="${top.id}" aria-label="完成 ${esc(top.title)}"></button><div class="list-main"><strong>${esc(top.title)}</strong><small>${top.priority==='high'?'高优先级 · ':''}${top.due?fmtDate(top.due):'今天想推进一点'}</small></div></div>`:`<div class="empty"><p>今天还没有待办。</p>${actionBtn('写一件小事','todos','ghost','plus')}</div>`}</section><section class="card card-pad news-card"><div class="section-head"><h2>科技动态</h2><button class="btn small ghost" data-route="news" type="button">看全部</button></div>${items.map(newsItem).join('')}</section><section class="card card-pad"><div class="section-head"><h2>项目在路上</h2><button clas     function accountForm(){ return `<form data-form="account"><div class="form-grid"><label>名称<input name="name" required placeholder="例如：邮箱 / 设计工具" /></label><label>账号<input name="username" required autocomplete="username" /></label><label>密码<input name="password" required type="password" autocomplete="current-password" /></label><label>备注<textarea name="note"></textarea></label></div><div class="form-actions"><button class="btn ghost" type="button" data-close-inline>取消</button><button class="btn primary" type="submit">保存账号</button></div></form>`; }
    function renderPomodoro(){ const p=state.pomodoro; return `${header('番茄钟','让身体也参与今天的工作。专注一会儿，然后起来活动。')}<section class="card pomodoro"><div class="timer" aria-live="polite">${fmtClock(p.remaining)}</div><div class="timer-actions">${p.running?'<button class="btn primary" data-pause-pomodoro type="button">PAUSE</button>':'<button class="btn primary" data-start-pomodoro type="button">START</button>'}<button class="btn ghost" data-reset-pomodoro type="button">RESET</button></div></section>`; }
    function renderSettings(){ return `${header('设置与迁移','换手机的时候，把兔几一起带走。')}<section class="card card-pad"><div class="section-head"><h2>数据备份</h2><span class="pill">本地优先</span></div><p class="muted">导出一个备份文件，发送到另一台手机后再导入。普通内容会保存，账号密码会单独加密。</p><div class="head-actions"><button class="btn primary" data-export type="button">${icon('download')}导出备份</button><button class="btn ghost" data-import-trigger type="button">${icon('upload')}导入备份</button><input id="backup-file" type="file" accept="application/json,.json" hidden /></div><div class="subtle-line"></div><p class="muted" style="font-size:13px;margin-bottom:0">清除 Safari 网站数据会清除未备份的内容。建议每隔一段时间导出一次，放进 iCloud Drive。</p></section><section class="card card-pad" style="margin-top:14px"><div class="section-head"><h2>使用提示</h2></div><p>在 Safari 打开这个页面后，点击分享 → 添加到主屏幕。手机端会自动使用底部导航，大屏会使用侧边栏。</p></section>`; }
    function moreSheet(){ const el=document.querySelector('#sheet'), inner=document.querySelector('#sheet-inner'); inner.innerHTML=`<div class="sheet-head"><h2>更多</h2><button class="icon-btn" type="button" data-close-sheet aria-label="关闭更多菜单">×</button></div><div class="list"><button class="btn ghost" data-route="news" type="button">${icon('news')}科技动态</button><button class="btn ghost" data-route="pomodoro" type="button">${icon('clock')}番茄钟</button><button class="btn ghost" data-route="accounts" type="button">${icon('settings')}账号</button><button class="btn ghost" data-route="settings" type="button">${icon('download')}设置与迁移</button></div>`; el.showModal(); }
    function renderRoute(){ const routes={home:renderHome,todos:renderTodos,projects:renderProjects,collect:renderCollect,news:renderNews,accounts:renderAccounts,pomodoro:renderPomodoro,settings:renderSettings}; document.querySelector('#content').innerHTML=(routes[currentRoute]||renderHome)(); renderNav(); document.querySelector('#main-content').focus({preventScroll:true}); }
    function renderApp(){ renderRoute(); if(currentRoute==='home'){ const intro=document.querySelector('.home-intro'); if(intro&&!document.querySelector('.daily-image'))intro.insertAdjacentHTML('afterend','<figure class="daily-image"><img src="assets/visitor-sun.jpg" alt="黑色星点与荒漠遗址的黑白图像" /></figure>'); const firstModule=document.querySelector('.dashboard-grid .home-module'); if(firstModule){firstModule.classList.add('inspiration-module'); firstModule.querySelector('h2')?.replaceChildren(document.createTextNode('星星碎片')); const insight=firstModule.querySelector('.insight'); const quote=insight?.querySelector('p'); const author=insight?.querySelector('p + p'); if(quote){quote.classList.add('home-quote'); quote.textContent='我只是一名心不在焉的游客，但我喜爱阳光。';} if(author){author.classList.add('muted'); author.textContent=' / 亚当•扎加耶夫斯基';} const divider=firstModule.querySelector('.subtle-line'); const oldTail=divider?.nextElementSibling; divider?.remove(); oldTail?.remove(); } } }
    function renderHome(){ const items=(state.newsCache?.items||sampleNews).slice(0,5); const inspiration=state.inspirations.find(x=>x.pinned)||state.inspirations[0]; const now=new Date(); const date=now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 '+now.toLocaleDateString('zh-CN',{weekday:'long'}); return `<section class="home-intro" aria-label="今日问候"><p class="hello">Hello! BaeeeT</p><p class="date">${date}</p><div class="rule" aria-hidden="true"></div></section><div class="dashboard-grid"><section class="card card-pad home-module"><div class="section-head"><div style="display:flex;align-items:center;gap:10px"><span class="module-icon" aria-hidden="true">${icon('spark')}</span><h2>星星碎片</h2></div>${actionBtn('捡星星','new-collect','small ghost','plus')}</div>${inspiration?`<div class="insight" style="margin-top:18px;border-radius:18px;padding:24px 20px"><p>${esc(inspiration.content)}</p><p class="muted">${esc(inspiration.tag||'星星碎片')}</p></div>`:`<div class="empty"><p>把此刻想到的东西记下来。</p>${actionBtn('写下一点灵感','new-collect','ghost','plus')}</div>`}<div class="subtle-line"></div><p class="muted" style="margin:0;font-size:13px">不急着整理，先让它有地方落脚。</p></section><section class="card card-pad home-module news-card"><div class="section-head"><div style="display:flex;align-items:center;gap:10px"><span class="module-icon" aria-hidden="true">${icon('news')}</span><h2>科技动态</h2></div><button class="btn small ghost" data-route="news" type="button">看全部</button></div>${items.map(newsItem).join('')}<div class="form-actions" style="justify-content:flex-start"><button class="btn small ghost" type="button" data-fetch-news>${icon('refresh')}<span>更新今日精选</span></button></div></section></div>`; }
    function openInline(kind){ const wrap=document.querySelector('#'+kind+'-form-wrap'); if(!wrap){ if(kind==='collect'){ nav('collect'); setTimeout(()=>openInline(kind),0); } return; } const html=kind==='todo'?todoForm():kind==='project'?projectForm():collectForm(); wrap.hidden=false; wrap.innerHTML=`<div class="section-head"><h2>${kind==='todo'?'添加待办':kind==='project'?'新建项目':'快速记录'}</h2><button class="icon-btn" data-close-inline type="button" aria-label="关闭表单">×</button></div>${html}`; wrap.scrollIntoView({behavior:'smooth',block:'start'}); wrap.querySelector('input,textarea')?.focus(); }
    function openAccount(){ showDialog('添加账号',accountForm()); }
    function showDialog(title,body){ const el=document.querySelector('#sheet'); document.querySelector('#sheet-inner').innerHTML=`<div class="sheet-head"><h2>${title}</h2><button class="icon-btn" type="button" data-close-sheet aria-label="关闭">×</button></div>${body}`; el.showModal(); el.querySelector('input,textarea')?.focus(); }
    function startTimer(){ if(state.pomodoro.running)return; update(s=>({...s,pomodoro:{...s.pomodoro,running:true,startedAt:Date.now()}})); runTimer(); }
    function pauseTimer(){ const elapsed=Math.floor((Date.now()-state.pomodoro.startedAt)/1000); update(s=>({...s,pomodoro:{...s.pomodoro,remaining:Math.max(0,s.pomodoro.remaining-elapsed),running:false,startedAt:null}})); clearInterval(timerId); }
    function resetTimer(){ clearInterval(timerId); update(s=>({...s,pomodoro:{duration:25*60,remaining:25*60,running:false,startedAt:null}})); }
    function runTimer(){ clearInterval(timerId); timerId=setInterval(()=>{ if(!state.pomodoro.running)return; const left=Math.max(0,state.pomodoro.remaining-Math.floor((Date.now()-state.pomodoro.startedAt)/1000)); if(left<=0){clearInterval(timerId); update(s=>({...s,pomodoro:{...s.pomodoro,remaining:0,running:false,startedAt:null}})); toast('番茄钟结束，起来活动一下。'); if('Notification'in window&&Notification.permission==='granted')new Notification('兔几提醒你：起来活动一下');} else { document.querySelector('.timer')?.replaceChildren(document.createTextNode(fmtClock(left))); } },1000); }
    async function fetchNews(silent=false){ const btn=document.querySelector('[data-fetch-news]'); if(btn){btn.disabled=true;btn.querySelector('span').textContent='获取中…';} try { const res=await fetch('https://hn.algolia.com/api/v1/search_by_date?query=AI&tags=story&hitsPerPage=10'); if(!res.ok)throw new Error(); const json=await res.json(); const items=(json.hits||[]).filter(x=>x.title&&x.url).slice(0,5).map(x=>({id:'news-'+x.objectID,title:x.title,source:'Hacker News',time:new Date(x.created_at).toLocaleDateString('zh-CN',{month:'short',day:'numeric'}),url:x.url,isExample:false})); if(!items.length)throw new Error(); update(s=>({...s,newsCache:{items,fetchedAt:Date.now(),isExample:false}})); if(!silent)toast('今天的 5 条科技动态已更新。'); } catch { if(!silent)toast('网络暂时不可用，已保留上次内容。'); } finally { renderApp(); } }
    async function refreshNewsOnOpen(){ if(newsAutoRequested||!navigator.onLine)return; newsAutoRequested=true; await fetchNews(true); }
    function b64(bytes){ return btoa(String.fromCharCode(...new Uint8Array(bytes))); }
    function unb64(s){ return Uint8Array.from(atob(s),c=>c.charCodeAt(0)); }
    async function derive(pass,salt){ const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']); return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:120000,hash:'SHA-256'},key,{name:'AES-GCM',length:256},false,['encrypt','decrypt']); }
    async function encryptAccounts(accounts,pass){ const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await derive(pass,salt); const data=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(accounts))); return {salt:b64(salt),iv:b64(iv),data:b64(data)}; }
    async function decryptAccounts(payload,pass){ const key=await derive(pass,unb64(payload.salt)); const data=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(payload.iv)},key,unb64(payload.data)); return JSON.parse(new TextDecoder().decode(data)); }
    async function exportBackup(){ const pass=prompt('设置一个备份密码（账号密码会用它加密）：'); if(!pass)return; const backup={schemaVersion:1,exportedAt:Date.now(),todos:state.todos,projects:state.projects,inspirations:state.inspirations,wishlists:state.wishlists,newsCache:state.newsCache,pomodoro:state.pomodoro,encryptedAccounts:await encryptAccounts(state.accounts,pass)}; const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='tuji-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); URL.revokeObjectURL(a.href); toast('备份已导出。'); }
    async function importBackup(file){ const raw=JSON.parse(await file.text()); if(raw.schemaVersion!==1)throw new Error('版本不兼容'); let accounts=[]; if(raw.encryptedAccounts){ const pass=prompt('请输入备份密码：'); if(!pass)throw new Error('需要备份密码'); accounts=await decryptAccounts(raw.encryptedAccounts,pass); } update(s=>({...s,todos:merge(s.todos,raw.todos),projects:merge(s.projects,raw.projects),inspirations:merge(s.inspirations,raw.inspirations),wishlists:merge(s.wishlists,raw.wishlists),accounts:merge(s.accounts,accounts),newsCache:raw.newsCache||s.newsCache,pomodoro:raw.pomodoro||s.pomodoro})); toast('备份已导入，重复记录已自动合并。'); }
    function merge(a,b){ const map=new Map((a||[]).map(x=>[x.id,x])); (b||[]).forEach(x=>map.set(x.id,x)); return [...map.values()]; }
    document.addEventListener('click', async e=>{ const action=e.target.closest('[data-action]')?.dataset.action; if(action==='new-todo')openInline('todo'); if(action==='new-project')openInline('project'); if(action==='new-collect')openInline('collect'); if(action==='new-account')openAccount(); const route=e.target.closest('[data-route]')?.dataset.route; if(route){ if(route==='more'){moreSheet();return;} if(document.querySelector('#sheet').open)document.querySelector('#sheet').close(); nav(route);return; } const toggle=e.target.closest('[data-todo-toggle]')?.dataset.todoToggle; if(toggle){update(s=>({...s,todos:s.todos.map(t=>t.id===toggle?{...t,done:!t.done}:t)}));return;} const delTodo=e.target.closest('[data-delete-todo]')?.dataset.deleteTodo; if(delTodo&&confirm('删除这条待办？'))update(s=>({...s,todos:s.todos.filter(t=>t.id!==delTodo)})); const delProject=e.target.closest('[data-delete-project]')?.dataset.deleteProject; if(delProject&&confirm('删除这个项目？'))update(s=>({...s,projects:s.projects.filter(p=>p.id!==delProject)})); const editProject=e.target.closest('[data-edit-project]')?.dataset.editProject; if(editProject){const p=state.projects.find(x=>x.id===editProject);showDialog('编辑项目',projectForm(p));} const tab=e.target.closest('[data-collect-tab]')?.dataset.collectTab; if(tab)update(s=>({...s,ui:{...s.ui,collectTab:tab}})); if(e.target.closest('[data-close-inline]')){const w=e.target.closest('.form-card');if(w){w.hidden=true;w.innerHTML='';}} if(e.target.closest('[data-close-sheet]'))document.querySelector('#sheet').close(); if(e.target.closest('[data-start-pomodoro]')){startTimer(); if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();} if(e.target.closest('[data-pause-pomodoro]'))pauseTimer(); if(e.target.closest('[data-reset-pomodoro]'))resetTimer(); if(e.target.closest('[data-fetch-news]'))fetchNews(); if(e.target.closest('[data-export]'))exportBackup(); if(e.target.closest('[data-import-trigger]'))document.querySelector('#backup-file').click(); const delI=e.target.closest('[data-delete-inspiration]')?.dataset.deleteInspiration; if(delI&&confirm('删除这条灵感？'))update(s=>({...s,inspirations:s.inspirations.filter(x=>x.id!==delI)})); const delW=e.target.closest('[data-delete-wish]')?.dataset.deleteWish; if(delW&&confirm('删除这项种草？'))update(s=>({...s,wishlists:s.wishlists.filter(x=>x.id!==delW)})); const tw=e.target.closest('[data-wish-toggle]')?.dataset.wishToggle; if(tw)update(s=>({...s,wishlists:s.wishlists.map(x=>x.id===tw?{...x,status:x.status==='已完成'?'想看':'已完成'}:x)})); const ts=e.target.closest('[data-toggle-secret]')?.dataset.toggleSecret; if(ts){const a=state.accounts.find(x=>x.id===ts);const el=document.querySelector(`[data-secret="${ts}"]`);if(el)el.textContent=el.textContent.includes('•')?a.password:'••••••••';} const cp=e.target.closest('[data-copy-secret]')?.dataset.copySecret; if(cp){const a=state.accounts.find(x=>x.id===cp);await navigator.clipboard?.writeText(a.password);toast('密码已复制。');} });
    document.addEventListener('submit',e=>{ const f=e.target; if(!f.matches('[data-form]'))return; e.preventDefault(); const d=Object.fromEntries(new FormData(f)); if(f.dataset.form==='todo'){update(s=>{const item={id:d.id||id('todo'),title:d.title,priority:d.priority,due:d.due,note:d.note,done:false,archived:false,createdAt:Date.now()};return {...s,todos:d.id?s.todos.map(x=>x.id===d.id?{...x,...item}:x):[item,...s.todos]}});toast('待办已保存。');} if(f.dataset.form==='project'){update(s=>{const item={id:d.id||id('project'),name:d.name,status:d.status,deadline:d.deadline,summary:d.summary,details:d.details,updatedAt:Date.now()};return {...s,projects:d.id?s.projects.map(x=>x.id===d.id?{...x,...item}:x):[item,...s.projects]}});toast('项目已保存。');} if(f.dataset.form==='inspiration'){update(s=>({...s,inspirations:[{id:id('inspiration'),content:d.content,tag:d.tag,pinned:false,createdAt:Date.now()},...s.inspirations]}));toast('灵感已收好。');} if(f.dataset.form==='wishlist'){update(s=>({...s,wishlists:[{id:id('wish'),name:d.name,type:d.type,note:d.note,url:d.url,status:'想看',createdAt:Date.now()},...s.wishlists]}));toast('已加入种草清单。');} if(f.dataset.form==='account'){update(s=>({...s,accounts:[{id:id('account'),name:d.name,username:d.username,password:d.password,note:d.note,updatedAt:Date.now()},...s.accounts]}));toast('账号已保存。');} if(f.closest('#sheet')&&document.querySelector('#sheet').open)document.querySelector('#sheet').close(); });
    const backupInput=document.querySelector('#backup-file'); if(backupInput)backupInput.addEventListener('change',e=>{ const file=e.target.files?.[0]; if(file)importBackup(file).catch(err=>toast(err.message==='OperationError'?'备份密码不正确。':'导入失败，请确认文件完整。')); e.target.value=''; });
    window.addEventListener('hashchange',()=>{currentRoute=location.hash.slice(1)||'home';renderApp();});
    document.querySelector('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')e.currentTarget.close();});
    function updateConnectionStatus(){ const online=navigator.onLine; let el=document.querySelector('#sync-status'); if(!el){ const host=document.querySelector('.sidebar-bottom'); if(host){ el=document.createElement('small'); el.id='sync-status'; el.className='sync-status'; el.setAttribute('aria-live','polite'); el.innerHTML='<span class="sync-dot" aria-hidden="true"></span><span></span>'; host.appendChild(el); } } let mobile=document.querySelector('#sync-status-mobile'); if(!mobile){ const host=document.querySelector('#main-content'); if(host){ mobile=document.createElement('small'); mobile.id='sync-status-mobile'; mobile.className='sync-status sync-status-mobile'; mobile.setAttribute('aria-live','polite'); mobile.innerHTML='<span class="sync-dot" aria-hidden="true"></span><span></span>'; host.prepend(mobile); } } [el,mobile].filter(Boolean).forEach(item=>{ item.classList.toggle('offline',!online); item.querySelector('span:last-child').textContent=online?'🟢 在线 · 本地已保存':'⚪ 离线 · 本地已保存'; }); }
    window.addEventListener('online',updateConnectionStatus); window.addEventListener('offline',updateConnectionStatus);
    window.TujiApp={get state(){return state},navigate:nav,saveState:saveState};
    renderApp(); updateConnectionStatus(); hydrateFromIndexedDb(); refreshNewsOnOpen(); if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{}); if(state.pomodoro.running)runTimer();
  })();
